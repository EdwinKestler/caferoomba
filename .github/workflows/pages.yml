name: Project website
on:
  push:
    branches: [main]
    paths: ['site/**', 'docs/**', 'README.md', 'CONTRIBUTING.md', 'SECURITY.md', 'CHANGELOG.md', 'scripts/build_site.py', 'scripts/check_site.py', 'tests/test_site.py', '.github/workflows/pages.yml']
  pull_request:
    paths: ['site/**', 'docs/**', 'README.md', 'CONTRIBUTING.md', 'SECURITY.md', 'CHANGELOG.md', 'scripts/build_site.py', 'scripts/check_site.py', 'tests/test_site.py', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated site renderer
        run: python -m pip install -r site/requirements.txt pytest
      - name: Test publication code
        run: python -m pytest tests/test_site.py -q
      - name: Build allowlisted website
        run: python scripts/build_site.py
      - name: Check links and publication boundaries
        run: python scripts/check_site.py
      - name: Package public website only
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Verify Pages is enabled in repository settings
        uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
