<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="890" viewBox="0 0 1600 890" role="img" aria-labelledby="title desc"><title id="title">From human demonstration to robot motion</title><desc id="desc">Proposed architecture: Human demonstration to FPV video to Google Cloud Colab Enterprise to Cosmos physical reasoning to Lightweight learned navigation policy to NVIDIA Jetson to Cube Orange to Robot motion. Colab hosts the notebook; teacher compute is sized separately. Only the student is deployed.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10" fill="none" stroke="#66825f" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" rx="24" fill="#fffef9"/><g font-family="Arial, Helvetica, sans-serif"><text x="54" y="54" font-size="17" fill="#173b30" font-weight="700" text-anchor="start">CAFEROOMBA / PROPOSED CLOUD-TO-ROBOT ARCHITECTURE</text><text x="54" y="112" font-size="42" fill="#173b30" font-weight="700" text-anchor="start">Design locally. Train in the cloud. Act onboard.</text><text x="54" y="153" font-size="21" fill="#536458" font-weight="500" text-anchor="start">A locally authored notebook connects demonstrations, offline reasoning and a compact navigation policy.</text><rect x="54" y="191" width="352" height="277" rx="14" fill="#f7f7f1" stroke="#d9dfd4"/><text x="74" y="221" font-size="16" fill="#7b6b48" font-weight="700" text-anchor="start">01</text><text x="74" y="255" font-size="24" fill="#173b30" font-weight="700" text-anchor="start">Human</text><text x="74" y="283" font-size="24" fill="#173b30" font-weight="700" text-anchor="start">demonstration</text><g transform="translate(78,303)" stroke="#173b30" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"><circle cx="40" cy="12" r="9"/><path d="M40,24 V56 M40,30 L16,43 M40,30 L67,43 M40,56 L23,76 M40,56 L57,76"/></g><image x="212" y="303" width="140" height="90" href="data:image/webp;base64,"/><text x="74" y="419" font-size="19" fill="#536458" font-weight="500" text-anchor="start">Record human controls</text><text x="74" y="445" font-size="19" fill="#536458" font-weight="500" text-anchor="start">while demonstrating the task.</text><path d="M409,341 H427" stroke="#66825f" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="432" y="191" width="352" height="277" rx="14" fill="#f7f7f1" stroke="#d9dfd4"/><text x="452" y="221" font-size="16" fill="#7b6b48" font-weight="700" text-anchor="start">02</text><text x="452" y="255" font-size="24" fill="#173b30" font-weight="700" text-anchor="start">FPV video</text><g transform="translate(456,303)" stroke="#173b30" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"><rect x="2" y="9" width="76" height="57" rx="7"/><path d="M32,23 L56,38 L32,54 Z"/><path d="M10,2 H72 M10,74 H72"/></g><text x="452" y="419" font-size="19" fill="#536458" font-weight="500" text-anchor="start">Create causal clips with</text><text x="452" y="445" font-size="19" fill="#536458" font-weight="500" text-anchor="start">time-aligned action labels.</text><path d="M787,341 H805" stroke="#66825f" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="810" y="191" width="352" height="277" rx="14" fill="#edf3e8" stroke="#d9dfd4"/><text x="830" y="221" font-size="16" fill="#7b6b48" font-weight="700" text-anchor="start">03</text><text x="830" y="255" font-size="24" fill="#173b30" font-weight="700" text-anchor="start">Google Cloud</text><text x="830" y="283" font-size="24" fill="#173b30" font-weight="700" text-anchor="start">Colab Enterprise</text><g transform="translate(834,303)" stroke="#173b30" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"><path d="M15,42 C-10,36 1,10 22,14 C30,-6 61,-2 65,17 C87,15 91,43 71,43 Z"/><rect x="13" y="48" width="56" height="24" rx="3"/><path d="M3,78 H78 M26,56 H54 M26,63 H46"/></g><text x="830" y="419" font-size="19" fill="#536458" font-weight="500" text-anchor="start">Run the local notebook on</text><text x="830" y="445" font-size="19" fill="#536458" font-weight="500" text-anchor="start">approved cloud GPU compute.</text><path d="M1165,341 H1183" stroke="#66825f" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="1188" y="191" width="352" height="277" rx="14" fill="#f7f7f1" stroke="#d9dfd4"/><text x="1208" y="221" font-size="16" fill="#7b6b48" font-weight="700" text-anchor="start">04</text><text x="1208" y="255" font-size="24" fill="#173b30" font-weight="700" text-anchor="start">Cosmos physical</text><text x="1208" y="283" font-size="24" fill="#173b30" font-weight="700" text-anchor="start">reasoning</text><g transform="translate(1212,303)" stroke="#173b30" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"><circle cx="15" cy="14" r="9"/><circle cx="66" cy="14" r="9"/><circle cx="41" cy="61" r="9"/><path d="M24,14 H57 M19,23 L36,52 M62,23 L45,52"/></g><text x="1208" y="419" font-size="19" fill="#536458" font-weight="500" text-anchor="start">Offline teacher annotations;</text><text x="1208" y="445" font-size="19" fill="#536458" font-weight="500" text-anchor="start">teacher hosting sized separately.</text><rect x="54" y="499" width="352" height="277" rx="14" fill="#edf3e8" stroke="#d9dfd4"/><text x="74" y="529" font-size="16" fill="#7b6b48" font-weight="700" text-anchor="start">05</text><text x="74" y="563" font-size="24" fill="#173b30" font-weight="700" text-anchor="start">Lightweight learned</text><text x="74" y="591" font-size="24" fill="#173b30" font-weight="700" text-anchor="start">navigation policy</text><g transform="translate(78,611)" stroke="#173b30" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"><circle cx="10" cy="12" r="6"/><circle cx="10" cy="63" r="6"/><circle cx="43" cy="37" r="9"/><circle cx="76" cy="12" r="6"/><circle cx="76" cy="63" r="6"/><path d="M16,15 L35,32 M16,59 L35,43 M51,32 L70,16 M51,42 L70,59"/></g><text x="74" y="727" font-size="19" fill="#536458" font-weight="500" text-anchor="start">Train, evaluate and export</text><text x="74" y="753" font-size="19" fill="#536458" font-weight="500" text-anchor="start">a compact temporal student.</text><path d="M409,649 H427" stroke="#66825f" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="432" y="499" width="352" height="277" rx="14" fill="#f7f7f1" stroke="#d9dfd4"/><text x="452" y="529" font-size="16" fill="#7b6b48" font-weight="700" text-anchor="start">06</text><text x="452" y="563" font-size="24" fill="#173b30" font-weight="700" text-anchor="start">NVIDIA Jetson</text><g transform="translate(456,611)" stroke="#173b30" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"><rect x="8" y="12" width="64" height="52" rx="5"/><rect x="25" y="24" width="30" height="26"/><path d="M17,4 V12 M30,4 V12 M45,4 V12 M60,4 V12 M17,64 V73 M30,64 V73 M45,64 V73 M60,64 V73 M0,24 H8 M0,39 H8 M0,53 H8 M72,24 H80 M72,39 H80 M72,53 H80"/></g><text x="452" y="727" font-size="19" fill="#536458" font-weight="500" text-anchor="start">Run the student locally</text><text x="452" y="753" font-size="19" fill="#536458" font-weight="500" text-anchor="start">on the Orin Nano.</text><path d="M787,649 H805" stroke="#66825f" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="810" y="499" width="352" height="277" rx="14" fill="#f7f7f1" stroke="#d9dfd4"/><text x="830" y="529" font-size="16" fill="#7b6b48" font-weight="700" text-anchor="start">07</text><text x="830" y="563" font-size="24" fill="#173b30" font-weight="700" text-anchor="start">Cube Orange</text><g transform="translate(834,611)" stroke="#173b30" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"><path d="M40,2 L74,21 V60 L40,79 L6,60 V21 Z M6,21 L40,40 L74,21 M40,40 V79"/></g><text x="830" y="727" font-size="19" fill="#536458" font-weight="500" text-anchor="start">Validated navigation goals;</text><text x="830" y="753" font-size="19" fill="#536458" font-weight="500" text-anchor="start">ArduPilot owns the actuators.</text><path d="M1165,649 H1183" stroke="#66825f" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="1188" y="499" width="352" height="277" rx="14" fill="#f7f7f1" stroke="#d9dfd4"/><text x="1208" y="529" font-size="16" fill="#7b6b48" font-weight="700" text-anchor="start">08</text><text x="1208" y="563" font-size="24" fill="#173b30" font-weight="700" text-anchor="start">Robot motion</text><g transform="translate(1212,611)" stroke="#173b30" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"><rect x="12" y="25" width="56" height="29" rx="7"/><circle cx="20" cy="60" r="9"/><circle cx="60" cy="60" r="9"/><path d="M40,25 V8 M29,8 H51 M73,38 H89 M81,29 L90,38 L81,47"/></g><text x="1208" y="727" font-size="19" fill="#536458" font-weight="500" text-anchor="start">Observe the physical result</text><text x="1208" y="753" font-size="19" fill="#536458" font-weight="500" text-anchor="start">and close the feedback loop.</text><path d="M1510,469 V484 H72 V495" stroke="#66825f" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="54" y="826" font-size="21" fill="#536458" font-weight="500" text-anchor="start">Human controls are the primary labels. Teacher supervision is a planned extension.</text><text x="54" y="859" font-size="18" fill="#536458" font-weight="500" text-anchor="start">Concept illustration. Cloud execution and field autonomy need separate validation. No live Cosmos/cloud dependency onboard.</text></g></svg>