<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="875" viewBox="0 0 1600 875" role="img" aria-labelledby="title desc"><title id="title">From computer vision to Physical AI</title><desc id="desc">Perception to Reasoning to Learned Action to Navigation to Memory to Autonomy. Robot motion produces the next observation. Proposed mission, not field validation.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10" fill="none" stroke="#66825f" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" rx="24" fill="#fffef9"/><g font-family="Arial, Helvetica, sans-serif"><text x="54" y="57" font-size="17" fill="#173b30" font-weight="700" text-anchor="start">CAFEROOMBA / THIS EXPERIMENT</text><text x="54" y="116" font-size="46" fill="#173b30" font-weight="700" text-anchor="start">From computer vision to Physical AI.</text><text x="54" y="158" font-size="22" fill="#536458" font-weight="500" text-anchor="start">Understand the scene. Propose an action. Constrain the motion. Remember the work.</text><rect x="54" y="212" width="473" height="236" rx="15" fill="#f1f4e9" stroke="#d9dfd4"/><text x="78" y="247" font-size="16" fill="#173b30" font-weight="700" text-anchor="start">01 / PERCEPTION</text><g transform="translate(79,270)" stroke="#173b30" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"><rect x="2" y="9" width="76" height="57" rx="7"/><path d="M32,23 L56,38 L32,54 Z"/><path d="M10,2 H72 M10,74 H72"/></g><text x="187" y="318" font-size="31" fill="#173b30" font-weight="700" text-anchor="start">Perception</text><text x="78" y="390" font-size="22" fill="#536458" font-weight="500" text-anchor="start">See coffee regions, boundaries</text><text x="78" y="420" font-size="22" fill="#536458" font-weight="500" text-anchor="start">and changes in the workspace.</text><rect x="563" y="212" width="473" height="236" rx="15" fill="#f1f4e9" stroke="#d9dfd4"/><text x="587" y="247" font-size="16" fill="#173b30" font-weight="700" text-anchor="start">02 / REASONING</text><g transform="translate(588,270)" stroke="#173b30" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"><circle cx="15" cy="14" r="9"/><circle cx="66" cy="14" r="9"/><circle cx="41" cy="61" r="9"/><path d="M24,14 H57 M19,23 L36,52 M62,23 L45,52"/></g><text x="696" y="318" font-size="31" fill="#173b30" font-weight="700" text-anchor="start">Reasoning</text><text x="587" y="390" font-size="22" fill="#536458" font-weight="500" text-anchor="start">Interpret task context; use offline</text><text x="587" y="420" font-size="22" fill="#536458" font-weight="500" text-anchor="start">teacher annotations in training.</text><rect x="1072" y="212" width="473" height="236" rx="15" fill="#173b30" stroke="#d9dfd4"/><text x="1096" y="247" font-size="16" fill="#eef5df" font-weight="700" text-anchor="start">03 / LEARNED ACTION</text><g transform="translate(1097,270)" stroke="#eef5df" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"><circle cx="10" cy="12" r="6"/><circle cx="10" cy="63" r="6"/><circle cx="43" cy="37" r="9"/><circle cx="76" cy="12" r="6"/><circle cx="76" cy="63" r="6"/><path d="M16,15 L35,32 M16,59 L35,43 M51,32 L70,16 M51,42 L70,59"/></g><text x="1205" y="318" font-size="31" fill="#eef5df" font-weight="700" text-anchor="start">Learned Action</text><text x="1096" y="390" font-size="22" fill="#d1dfc3" font-weight="500" text-anchor="start">The student proposes the next</text><text x="1096" y="420" font-size="22" fill="#d1dfc3" font-weight="500" text-anchor="start">typed navigation intent.</text><rect x="1072" y="503" width="473" height="236" rx="15" fill="#f1f4e9" stroke="#d9dfd4"/><text x="1096" y="538" font-size="16" fill="#173b30" font-weight="700" text-anchor="start">04 / NAVIGATION</text><g transform="translate(1097,561)" stroke="#173b30" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"><rect x="12" y="25" width="56" height="29" rx="7"/><circle cx="20" cy="60" r="9"/><circle cx="60" cy="60" r="9"/><path d="M40,25 V8 M29,8 H51 M73,38 H89 M81,29 L90,38 L81,47"/></g><text x="1205" y="609" font-size="31" fill="#173b30" font-weight="700" text-anchor="start">Navigation</text><text x="1096" y="681" font-size="22" fill="#536458" font-weight="500" text-anchor="start">Constrain the path and maneuver</text><text x="1096" y="711" font-size="22" fill="#536458" font-weight="500" text-anchor="start">before the Cube executes it.</text><rect x="563" y="503" width="473" height="236" rx="15" fill="#f1f4e9" stroke="#d9dfd4"/><text x="587" y="538" font-size="16" fill="#173b30" font-weight="700" text-anchor="start">05 / MEMORY</text><g transform="translate(588,561)" stroke="#173b30" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"><rect x="8" y="12" width="64" height="52" rx="5"/><rect x="25" y="24" width="30" height="26"/><path d="M17,4 V12 M30,4 V12 M45,4 V12 M60,4 V12 M17,64 V73 M30,64 V73 M45,64 V73 M60,64 V73 M0,24 H8 M0,39 H8 M0,53 H8 M72,24 H80 M72,39 H80 M72,53 H80"/></g><text x="696" y="609" font-size="31" fill="#173b30" font-weight="700" text-anchor="start">Memory</text><text x="587" y="681" font-size="22" fill="#536458" font-weight="500" text-anchor="start">Record serviced patches</text><text x="587" y="711" font-size="22" fill="#536458" font-weight="500" text-anchor="start">and mission history.</text><rect x="54" y="503" width="473" height="236" rx="15" fill="#f1f4e9" stroke="#d9dfd4"/><text x="78" y="538" font-size="16" fill="#173b30" font-weight="700" text-anchor="start">06 / AUTONOMY</text><g transform="translate(79,561)" stroke="#173b30" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"><rect x="12" y="25" width="56" height="29" rx="7"/><circle cx="20" cy="60" r="9"/><circle cx="60" cy="60" r="9"/><path d="M40,25 V8 M29,8 H51 M73,38 H89 M81,29 L90,38 L81,47"/></g><text x="187" y="609" font-size="31" fill="#173b30" font-weight="700" text-anchor="start">Autonomy</text><text x="78" y="681" font-size="22" fill="#536458" font-weight="500" text-anchor="start">Coordinate work, return and</text><text x="78" y="711" font-size="22" fill="#536458" font-weight="500" text-anchor="start">charging as an intended mission.</text><path d="M530,331 H557" stroke="#66825f" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M1039,331 H1067" stroke="#66825f" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M1310,452 V497" stroke="#66825f" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M1068,621 H1043" stroke="#66825f" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M559,621 H532" stroke="#66825f" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M54,621 H29 V331 H49" stroke="#66825f" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="800" y="798" font-size="24" fill="#173b30" font-weight="700" text-anchor="middle">Robot motion changes the scene. The next observation closes the loop.</text><text x="800" y="841" font-size="18" fill="#536458" font-weight="500" text-anchor="middle">Conceptual flow • Memory is task history, not automatic online retraining • Independent safety remains essential</text></g></svg>