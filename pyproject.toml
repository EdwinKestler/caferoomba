[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "caferoomba"
version = "0.1.0"
description = "CafeRoomba CPU-first coffee-bean patio sweeper policy pipeline"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Edwin Kestler" }]
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pillow>=10,<12",
  "pydantic>=2.6,<3",
  "pyyaml>=6,<7",
  "typer>=0.12,<1",
  "rich>=13,<15",
]

[project.optional-dependencies]
cpu = [
  "torch>=2.4",
  "torchvision>=0.19",
  "onnx>=1.16",
  "onnxruntime>=1.18",
]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6",
  "ruff>=0.6",
  "mypy>=1.11",
  "nbformat>=5.10",
  "nbclient>=0.10",
]
cloud = [
  "google-cloud-storage>=2.18",
  "google-auth>=2.34",
]
autopilot = [
  "pymavlink>=2.4",
]

[project.scripts]
caferoomba = "caferoomba.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
markers = [
  "slow: optional longer CPU checks",
]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
pretty = true
